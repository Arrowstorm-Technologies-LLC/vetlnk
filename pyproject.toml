[project]
name = "vetlnk"
version = "0.5.0"
description = "A fast, zero-friction command-line link-vetting tool for checking a suspicious link before clicking it"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arrowstorm Technologies LLC" }]
keywords = ["security", "url", "phishing", "cli", "link-checker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "dnspython>=2.6",
    "python-whois>=0.9",
    "keyring>=25.2",
    "questionary>=2.0",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "cryptography>=42.0",
]

[project.optional-dependencies]
vt = ["vt-py>=0.18"]
# Only the Docker SDK is needed on the host — python-magic/yara-python run
# *inside* the analyzer container (installed there via its own Dockerfile),
# never imported by vetlnk itself.
detonate = ["docker>=7.1"]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
vetlnk = "vetlnk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vetlnk"]

[tool.hatch.build.targets.sdist]
include = ["src/vetlnk", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
